<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6f8; --surface: #fff; --surface-2: #f9fafb; --border: #e6e8ec;
    --text: #0f172a; --muted: #64748b; --faint: #94a3b8;
    --accent: #4f46e5; --accent-soft: #eef2ff; --on-accent: #fff;
    --ok: #15803d; --ok-soft: #dcfce7; --warn: #b45309; --warn-soft: #fef3c7;
    --bad: #b91c1c; --bad-soft: #fee2e2; --info: #1d4ed8; --info-soft: #dbeafe; --neutral-soft: #f1f5f9;
    --r: 10px; --shadow: 0 1px 2px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.06);
    --overlay: rgba(15,23,42,.35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f17; --surface: #121826; --surface-2: #161d2d; --border: #232c3f;
      --text: #e5e9f0; --muted: #94a3b8; --faint: #64748b;
      --accent: #818cf8; --accent-soft: #1e1b4b; --on-accent: #0b0f17;
      --ok: #4ade80; --ok-soft: #0f2e1c; --warn: #fbbf24; --warn-soft: #33260a;
      --bad: #f87171; --bad-soft: #3a1414; --info: #60a5fa; --info-soft: #102544; --neutral-soft: #1c2436;
      --shadow: none; --overlay: rgba(0,0,0,.55);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 Inter, system-ui, sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 32px 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--muted); font-weight: 500; }
  .live { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px var(--ok-soft); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
  .stat .label { color: var(--muted); font-size: 12px; font-weight: 500; }
  .stat .value { font-size: 26px; font-weight: 700; margin-top: 4px; letter-spacing: -.02em; }
  .stat.hero .value { color: var(--accent); }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .tab { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 500; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  .tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 10px 16px; background: var(--surface-2); border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tbody tr.row { cursor: pointer; }
  tbody tr.row:hover td { background: var(--surface-2); }
  tbody tr.row.selected td { background: var(--accent-soft); }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; }
  .muted { color: var(--muted); }
  .ellipsis { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 12px; flex: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .b-ok { background: var(--ok-soft); color: var(--ok); } .b-warn { background: var(--warn-soft); color: var(--warn); }
  .b-bad { background: var(--bad-soft); color: var(--bad); } .b-info { background: var(--info-soft); color: var(--info); }
  .b-neutral { background: var(--neutral-soft); color: var(--muted); }
  .chip { font-family: "JetBrains Mono", monospace; font-size: 11px; padding: 2px 6px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  button.act { font: inherit; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--bad); cursor: pointer; }
  button.act:hover { background: var(--bad-soft); border-color: transparent; }
  .empty { padding: 48px; text-align: center; color: var(--muted); }

  .overlay { position: fixed; inset: 0; background: var(--overlay); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  aside { position: fixed; top: 0; right: 0; height: 100%; width: min(560px, 100%); background: var(--bg); border-left: 1px solid var(--border); transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column; }
  aside.open { transform: none; }
  .drawer-head { padding: 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .drawer-head .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .drawer-head h2 { margin: 0; font-size: 16px; }
  .close { border: 0; background: var(--surface-2); color: var(--muted); width: 32px; height: 32px; border-radius: 8px; font-size: 18px; cursor: pointer; }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; color: var(--muted); font-size: 13px; }
  .summary { margin-top: 10px; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .h3 { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 12px 0 2px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .opt { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .tool { align-self: flex-start; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; max-width: 100%; }
  .tool details { min-width: 0; }
  .tool summary { cursor: pointer; list-style: none; }
  .tool pre { margin: 6px 0 0; padding: 8px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; }
  .sys { align-self: center; font-size: 12px; color: var(--muted); background: var(--neutral-soft); padding: 4px 10px; border-radius: 999px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px; }
  .card + .card { margin-top: 8px; }
  .card .row2 { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI Hosting Support <span>· консоль оператора</span></h1>
    <div class="live"><span class="dot"></span><span id="updated">оновлення…</span></div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="tabs">
    <button class="tab active" data-tab="tickets">Тікети</button>
    <button class="tab" data-tab="audit">Аудит дій</button>
  </div>

  <section id="tab-tickets"><div class="scroll"><table>
    <thead><tr><th>Клієнт</th><th>Запит</th><th>Статус</th><th>Кроків AI</th><th>Оцінка</th><th>Час</th></tr></thead>
    <tbody id="tickets"></tbody>
  </table></div></section>

  <section id="tab-audit" hidden><div class="scroll"><table>
    <thead><tr><th>Час</th><th>Клієнт</th><th>Дія</th><th>План, який погодив клієнт</th><th>Результат</th><th></th></tr></thead>
    <tbody id="audit"></tbody>
  </table></div></section>
</div>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<aside id="drawer" aria-label="Деталі тікета">
  <div class="drawer-head" id="drawer-head"></div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const time = (iso) => new Date(iso).toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const STATUS = {
  open: ["розслідує", "b-info"], waiting_user: ["чекає клієнта", "b-warn"], in_progress: ["виконується", "b-info"],
  resolved: ["вирішено ботом", "b-ok"], failed: ["помилка", "b-bad"], escalated: ["передано людині", "b-bad"], cancelled: ["скасовано", "b-neutral"],
};
const RESULT = { executed: ["виконано", "b-ok"], failed: ["помилка", "b-bad"], blocked: ["заблоковано", "b-warn"], rolled_back: ["відкат", "b-info"] };
const PLAN = { proposed: ["чекає підтвердження", "b-warn"], executed: ["виконано", "b-ok"], failed: ["помилка", "b-bad"], cancelled: ["замінено / скасовано", "b-neutral"] };
const badge = ([text, cls]) => `<span class="badge ${cls}">${esc(text)}</span>`;
const STATS = [
  ["resolvedByBotPct", "Вирішено ботом", (v) => `${v}%`, true],
  ["total", "Звернень", String],
  ["avgResolveSec", "Сер. час вирішення", (v) => (v >= 60 ? `${Math.round(v / 60)} хв` : `${v} с`)],
  ["escalated", "Передано людині", String],
  ["blocked", "Заблоковано дій", String],
  ["csatAvg", "CSAT", (v) => (v ? `${v} / 5` : "—")],
];
let selected = null;

document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t === b));
  document.getElementById("tab-tickets").hidden = b.dataset.tab !== "tickets";
  document.getElementById("tab-audit").hidden = b.dataset.tab !== "audit";
}));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

const who = (t) => {
  const name = t.userName || t.customerId;
  return `<div class="who"><div class="avatar">${esc(name.slice(0, 1).toUpperCase())}</div><div><div>${esc(name)}</div><div class="muted mono">${esc(t.customerId)} · ${esc(t.id)}</div></div></div>`;
};

function renderTickets(tickets) {
  const el = document.getElementById("tickets");
  if (!tickets.length) { el.innerHTML = `<tr><td colspan="6" class="empty">Поки немає звернень — напишіть боту</td></tr>`; return; }
  el.innerHTML = tickets.map((t) => `<tr class="row${t.id === selected ? " selected" : ""}" onclick="openDrawer('${t.id}')">
    <td>${who(t)}</td>
    <td><div class="ellipsis">${esc(t.summary || t.escalationReason || "—")}</div><div class="muted mono">${esc(t.intent)}</div></td>
    <td>${badge(STATUS[t.status] ?? [t.status, "b-neutral"])}</td>
    <td>${t.steps.length ? `<span class="chip">${t.steps.length}</span>` : '<span class="muted">—</span>'}</td>
    <td>${t.csat ? `★ ${t.csat}` : '<span class="muted">—</span>'}</td>
    <td class="muted">${time(t.createdAt)}</td></tr>`).join("");
}

function renderAudit(audit) {
  document.getElementById("audit").innerHTML = audit.length ? audit.map((a) => `<tr>
    <td class="muted">${time(a.at)}</td><td>${esc(a.customerId)}</td>
    <td><span class="chip">${esc(a.action)}</span><div class="muted mono">${esc(JSON.stringify(a.params))}</div></td>
    <td><div class="ellipsis">${esc(a.aiUnderstood) || `<span class="muted">${esc(a.detail)}</span>`}</div></td>
    <td>${badge(RESULT[a.result] ?? [a.result, "b-neutral"])}${a.rolledBack ? ` ${badge(["відкочено", "b-info"])}` : ""}</td>
    <td>${a.snapshotId && !a.rolledBack ? `<button class="act" onclick="rollback('${a.id}')">↩ Відкотити</button>` : ""}</td></tr>`).join("")
    : `<tr><td colspan="6" class="empty">Дій ще не було</td></tr>`;
}

function line(l) {
  if (l.role === "user") return `<div class="msg user">${esc(l.text)}</div>`;
  if (l.role === "system") return `<div class="sys">${esc(l.text)}</div>`;
  if (l.role === "bot") {
    const opts = Array.isArray(l.data) ? `<div class="opts">${l.data.map((o) => `<span class="opt">${esc(o.label)}</span>`).join("")}</div>` : "";
    return `<div class="msg bot">${esc(l.text)}${opts}</div>`;
  }
  return `<div class="tool"><span class="chip">${esc(l.tool)}</span><details><summary>${esc(l.text)}</summary><pre>${esc(JSON.stringify(l.data, null, 2))}</pre></details></div>`;
}

async function renderDrawer() {
  if (!selected) return;
  const t = await fetch("/api/tickets/" + selected).then((r) => r.json());
  document.getElementById("drawer-head").innerHTML = `
    <div class="top"><h2>Тікет ${esc(t.id)}</h2><button class="close" onclick="closeDrawer()" aria-label="Закрити">×</button></div>
    <div class="meta">${badge(STATUS[t.status] ?? [t.status, "b-neutral"])}<span>${esc(t.userName || t.customerId)}</span><span>·</span><span class="mono">${esc(t.intent)}</span><span>·</span><span>${time(t.createdAt)}</span>${t.csat ? `<span>· ★ ${t.csat}</span>` : ""}</div>
    ${t.summary ? `<div class="summary">${esc(t.summary)}</div>` : ""}
    ${t.escalationReason ? `<div class="summary">${badge(["ескалація", "b-bad"])} ${esc(t.escalationReason)}</div>` : ""}`;
  const plans = (t.plans ?? []).map((p) => `<div class="card"><div class="row2"><span class="mono">${esc(p.id)}</span>${badge(PLAN[p.status] ?? [p.status, "b-neutral"])}</div><div>${esc(p.text)}</div></div>`).join("");
  const audit = (t.audit ?? []).map((a) => `<div class="card"><div class="row2"><span><span class="chip">${esc(a.action)}</span> <span class="muted">${time(a.at)}</span></span><span>${badge(RESULT[a.result] ?? [a.result, "b-neutral"])}${a.rolledBack ? ` ${badge(["відкочено", "b-info"])}` : ""}</span></div>${a.snapshotId && !a.rolledBack ? `<div style="margin-top:8px"><button class="act" onclick="rollback('${a.id}')">↩ Відкотити</button></div>` : ""}</div>`).join("");
  document.getElementById("drawer-body").innerHTML =
    `<div class="h3">Розмова і кроки AI</div>${(t.transcript ?? []).map(line).join("") || '<span class="muted">Порожньо</span>'}` +
    (plans ? `<div class="h3">Плани</div>${plans}` : "") +
    (audit ? `<div class="h3">Аудит</div>${audit}` : "");
}

async function openDrawer(id) {
  selected = id;
  document.getElementById("drawer").classList.add("open");
  document.getElementById("overlay").classList.add("open");
  await renderDrawer();
  load(false);
}

function closeDrawer() {
  selected = null;
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("overlay").classList.remove("open");
  load(false);
}

async function rollback(id) {
  if (!confirm("Відкотити цю зміну? Сайт повернеться до стану перед дією, клієнт отримає повідомлення.")) return;
  await fetch("/api/rollback/" + id, { method: "POST" });
  load();
}

async function load(withDrawer = true) {
  const [stats, tickets, audit] = await Promise.all(["stats", "tickets", "audit"].map((p) => fetch("/api/" + p).then((r) => r.json())));
  document.getElementById("stats").innerHTML = STATS.map(([k, label, fmt, hero]) =>
    `<div class="stat${hero ? " hero" : ""}"><div class="label">${label}</div><div class="value">${fmt(stats[k])}</div></div>`).join("");
  renderTickets(tickets);
  renderAudit(audit);
  if (withDrawer) await renderDrawer();
  document.getElementById("updated").textContent = "оновлено " + time(new Date().toISOString());
}

load(); setInterval(load, 3000);
</script>
</body>
</html>
